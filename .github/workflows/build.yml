name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ONARG_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/onarg.jks"
          echo "ONARG_KEYSTORE_FILE=$RUNNER_TEMP/onarg.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          ONARG_KEYSTORE_PASSWORD: ${{ secrets.ONARG_KEYSTORE_PASSWORD }}
          ONARG_KEY_ALIAS: ${{ secrets.ONARG_KEY_ALIAS }}
          ONARG_KEY_PASSWORD: ${{ secrets.ONARG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Check the app requests no network permission
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          ! grep -q "android.permission.INTERNET" permissions.txt

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ONARG-Narrator.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/ONARG-Narrator-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ONARG-Narrator-apk
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/ONARG-Narrator.apk
